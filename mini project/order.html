<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Placed</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #11998e, #38ef7d);
    }

    .order-box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      color: #28a745;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 20px;
    }

    a {
      display: inline-block;
      text-decoration: none;
      background: #11998e;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
    }

    a:hover {
      background: #0c8976;
    }
  </style>
</head>

<body>

  <div class="order-box">
    <h1>✅ Order Placed Successfully</h1>
    <p>Thank you for shopping with us!</p>
    <a href="store.html">Go to Home</a>
  </div>

</body>
</html>
